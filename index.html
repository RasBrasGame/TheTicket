<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام إدارة التذاكر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0a0a14;color:#e8e8f0;min-height:100vh;direction:rtl}
.app{max-width:900px;margin:0 auto;min-height:100vh}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}

.loader{display:inline-block;width:20px;height:20px;border:3px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.loader-page{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#888;font-size:14px}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a14,#1a1a3e,#0a0a14);padding:20px}
.login-bg{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,rgba(99,102,241,.15),transparent 50%),radial-gradient(circle at 70% 80%,rgba(139,92,246,.1),transparent 50%);pointer-events:none}
.login-card{background:linear-gradient(145deg,#151528,#1a1a30);border-radius:20px;padding:40px 32px;width:100%;max-width:380px;position:relative;border:1px solid #2a2a4a;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadeUp .5s ease}
.login-logo{text-align:center;margin-bottom:32px}
.logo-icon{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:inline-flex;align-items:center;justify-content:center;color:#fff;margin-bottom:16px;box-shadow:0 8px 24px rgba(99,102,241,.3);font-size:24px}
.login-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:6px}
.login-subtitle{font-size:14px;color:#888}
.input-group{margin-bottom:18px}
.input-group label{display:block;font-size:13px;color:#aaa;margin-bottom:6px;font-weight:500}
input,select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a4a;background:#0f0f20;color:#e8e8f0;font-size:14px;font-family:'Tajawal',sans-serif;outline:none}
input:focus{border-color:#6366f1}
.error-msg{background:#ef444422;color:#ef4444;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;text-align:center;display:none}
.error-msg.show{display:block}
.login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif}
.login-btn:active{transform:scale(.98)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.demo-hint{text-align:center;margin-top:20px;font-size:12px;color:#666}
.demo-label{background:#6366f122;color:#818cf8;padding:2px 8px;border-radius:6px;font-size:11px}

.page{padding:16px 16px 100px;display:none}.page.active{display:block;animation:fadeUp .3s ease}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:8px}
.top-bar-right{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.welcome{font-size:18px;font-weight:700;color:#fff}
.welcome-sub{font-size:12px;color:#888}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid #2a2a4a;background:transparent;color:#888;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.back-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid #2a2a4a;background:transparent;color:#e8e8f0;font-size:14px;cursor:pointer;font-family:'Tajawal',sans-serif}
.btn-primary{padding:10px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Tajawal',sans-serif;display:inline-flex;align-items:center;gap:6px}
.btn-primary:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{padding:10px 20px;border-radius:10px;border:1px solid #2a2a4a;background:transparent;color:#e8e8f0;font-size:14px;cursor:pointer;font-family:'Tajawal',sans-serif}
.btn-dashed{width:100%;padding:14px;border-radius:14px;border:2px dashed #2a2a4a;background:transparent;color:#818cf8;font-size:15px;font-weight:600;cursor:pointer;font-family:'Tajawal',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-dashed:hover{background:#151528;border-color:#6366f1}
.btn-sm{width:28px;height:28px;border-radius:6px;border:1px solid #333;background:transparent;color:#888;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0}
.btn-sm:hover{color:#ef4444;border-color:#ef4444}

.overview-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px}
.stat-card{background:linear-gradient(145deg,#151528,#1a1a32);border-radius:14px;padding:18px;border:1px solid #2a2a4a;text-align:center}
.stat-card-value{font-size:24px;font-weight:800;color:#fff;margin-bottom:4px}
.stat-card-label{font-size:12px;color:#888}

.quick-actions{display:flex;gap:10px;margin-bottom:24px}
.quick-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;border:1px solid #2a2a4a;background:#151528;color:#e8e8f0;font-size:14px;font-weight:500;cursor:pointer;font-family:'Tajawal',sans-serif}
.quick-btn:hover{background:#1a1a35}
.quick-badge{background:#6366f1;color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px}
.section-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:#bbb;margin-bottom:16px}
.add-form{display:none;flex-wrap:wrap;gap:10px;background:#151528;border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid #2a2a4a}
.add-form.show{display:flex}
.add-form input{flex:1 1 140px;padding:10px 12px;font-size:13px}
.empty{text-align:center;padding:40px;color:#555;font-size:14px}

.event-card{background:linear-gradient(145deg,#151528,#1a1a32);border-radius:16px;padding:18px;border:1px solid #2a2a4a;cursor:pointer;margin-bottom:12px;transition:transform .15s,border-color .2s}
.event-card:hover{border-color:#4a4a6a;transform:translateY(-2px)}
.event-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.event-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:6px}
.event-meta{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#888}
.event-stats{display:flex;justify-content:space-between;background:#0a0a18;border-radius:12px;padding:12px}
.event-stat{text-align:center;flex:1}
.event-stat-num{display:block;font-size:18px;font-weight:700;color:#fff}
.event-stat-label{font-size:11px;color:#666}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:8px}
.page-title{font-size:18px;font-weight:700;color:#fff}
.email-stats{display:flex;gap:8px;margin-top:6px}
.badge-green{background:#22c55e22;color:#22c55e;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:600}
.badge-red{background:#ef444422;color:#ef4444;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:600}
.email-card{background:#151528;border-radius:12px;padding:14px 16px;border:1px solid #2a2a4a;margin-bottom:10px}
.email-card-header{display:flex;align-items:center;justify-content:space-between}
.email-info{display:flex;flex-direction:column;gap:6px}
.email-addr{font-size:14px;font-weight:600;color:#fff}
.email-pass{font-size:12px;color:#888;font-family:monospace;direction:ltr;text-align:right}
.email-status{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;width:fit-content}
.email-status.available{background:#22c55e18;color:#22c55e;border:1px solid #22c55e44}
.email-status.used{background:#ef444418;color:#ef4444;border:1px solid #ef444444}
.status-dot{width:8px;height:8px;border-radius:50%}
.email-status.available .status-dot{background:#22c55e;animation:pulse 2s infinite}
.email-status.used .status-dot{background:#ef4444}
.email-actions{display:flex;gap:8px;align-items:center}
.check-btn{width:32px;height:32px;border-radius:8px;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:700}
.delete-btn{width:32px;height:32px;border-radius:8px;border:1px solid #333;background:transparent;color:#ef4444;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}

.event-hero{background:linear-gradient(145deg,#1a1a3e,#151530);border-radius:18px;padding:24px;margin-bottom:16px;border:1px solid #2a2a4a;text-align:center}
.event-hero-title{font-size:22px;font-weight:800;color:#fff;margin-bottom:12px}
.event-hero-meta{display:flex;justify-content:center;gap:16px;font-size:13px;color:#aaa;margin-bottom:18px;flex-wrap:wrap}
.countdown-row{display:flex;justify-content:space-around;background:#0a0a18;border-radius:14px;padding:14px;flex-wrap:wrap;gap:8px}
.countdown-box{text-align:center;min-width:55px}
.countdown-num{display:block;font-size:20px;font-weight:800;color:#fff}
.countdown-label{font-size:11px;color:#666}

.email-group{background:#111122;border-radius:14px;margin-bottom:12px;border:1px solid #2a2a4a;overflow:hidden}
.email-group:hover{border-color:#3a3a5a}
.email-group-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:#151530;transition:background .2s}
.email-group-header:hover{background:#1a1a3a}
.eg-right{display:flex;align-items:center;gap:12px}
.eg-icon{width:36px;height:36px;border-radius:10px;background:#6366f122;color:#818cf8;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.eg-info{display:flex;flex-direction:column;gap:2px}
.eg-name{font-size:14px;font-weight:700;color:#fff}
.eg-sub{font-size:12px;color:#888}
.eg-stats{display:flex;gap:10px;align-items:center}
.mini-stat{text-align:center;padding:4px 10px;background:#0a0a18;border-radius:8px}
.mini-stat-num{display:block;font-size:14px;font-weight:700;color:#fff}
.mini-stat-label{font-size:10px;color:#666}
.eg-arrow{color:#555;font-size:14px;transition:transform .3s}
.email-group.open .eg-arrow{transform:rotate(90deg)}
.email-group-body{display:none}
.email-group.open .email-group-body{display:block}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ticket-table{width:100%;border-collapse:collapse;min-width:750px}
.ticket-table th{background:#0d0d1e;padding:10px 8px;font-size:11px;color:#888;font-weight:600;text-align:center;border-bottom:1px solid #2a2a4a;white-space:nowrap}
.ticket-table td{padding:10px 8px;font-size:13px;text-align:center;border-bottom:1px solid #1a1a2e;color:#ddd}
.ticket-table tr:hover td{background:#1a1a30}
.tcheck{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;border:2px solid #444;cursor:pointer;font-size:12px;color:transparent;transition:all .15s}
.tcheck.on{color:#fff}
.tcheck.s1{background:#6366f1;border-color:#6366f1}
.tcheck.s2{background:#f59e0b;border-color:#f59e0b}
.tcheck.s3{background:#22c55e;border-color:#22c55e}

.add-email-form{display:none;background:#151528;border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid #6366f144}
.add-email-form.show{display:block}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;color:#888;font-weight:500}
.ticket-row-card{background:#151530;border-radius:10px;padding:14px;margin-top:10px;border:1px solid #2a2a4a}
.ticket-row-title{font-size:13px;font-weight:700;color:#818cf8;margin-bottom:10px}

.edit-form{background:#0d0d1e;padding:14px 16px;border-bottom:1px solid #6366f144}
.edit-form .form-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.edit-actions{display:flex;gap:8px;margin-top:12px}

@media(max-width:600px){
  .overview-stats{grid-template-columns:1fr 1fr 1fr}
  .stat-card{padding:12px 8px}
  .stat-card-value{font-size:18px}
  .stat-card-label{font-size:10px}
  .countdown-num{font-size:16px}
  .countdown-row{padding:10px 6px;gap:4px}
  .countdown-box{min-width:45px}
  .countdown-label{font-size:9px}
  .form-grid{grid-template-columns:1fr 1fr}
  .add-eg-grid{grid-template-columns:1fr!important}
  .event-hero{padding:16px}
  .event-hero-title{font-size:18px}
  .event-hero-meta{font-size:12px;gap:8px}
  .eg-stats{gap:6px}
  .eg-stats .mini-stat{padding:3px 6px}
  .mini-stat-num{font-size:12px}
  .mini-stat-label{font-size:9px}
  .email-group-header{padding:12px;flex-wrap:wrap;gap:8px}
  .eg-right{min-width:0;overflow:hidden}
  .eg-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  .eg-sub{font-size:11px}
  .ticket-table{min-width:600px}
  .ticket-table th,.ticket-table td{padding:8px 5px;font-size:11px}
  .page-header{flex-wrap:wrap;gap:8px}
  .quick-actions{flex-direction:column}
  .event-card{padding:14px}
  .event-stats{flex-wrap:wrap;gap:4px}
  .event-stat{min-width:60px}
  .event-stat-num{font-size:15px}
  .event-stat-label{font-size:10px}
  .top-bar{flex-wrap:wrap;gap:8px}
  .add-email-form{padding:14px}
  .btn-dashed{font-size:14px;padding:12px}
  .email-card-header{flex-wrap:wrap;gap:8px}
}
@media(max-width:380px){
  .overview-stats{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .eg-name{max-width:120px}
}
</style>
</head>
<body>
<div class="app" id="app">

<div class="loader-page" id="loaderPage"><div class="loader"></div><span>جاري التحميل...</span></div>

<div class="login-page" id="loginPage" style="display:none">
<div class="login-bg"></div>
<div class="login-card">
<div class="login-logo"><div class="logo-icon">🎫</div><div class="login-title">نظام إدارة التذاكر</div><div class="login-subtitle">سجّل دخولك للمتابعة</div></div>
<div class="input-group"><label>اسم المستخدم</label><input type="text" id="loginUser" placeholder="أدخل اسم المستخدم"></div>
<div class="input-group"><label>كلمة المرور</label><input type="password" id="loginPass" placeholder="أدخل كلمة المرور"></div>
<div class="error-msg" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
<button class="login-btn" id="loginBtn" onclick="doLogin()">تسجيل الدخول</button>
</div>
</div>

<div class="page" id="dashboardPage">
<div class="top-bar"><div class="top-bar-right"><div class="avatar" id="av">أ</div><div><div class="welcome" id="welc">أهلاً 👋</div><div class="welcome-sub">لوحة إدارة التذاكر</div></div></div><button class="icon-btn" onclick="doLogout()">🚪</button></div>
<div class="overview-stats" id="overviewStats"></div>
<div class="quick-actions">
<button class="quick-btn" onclick="nav('emailsPage')">📧 الإيميلات <span class="quick-badge" id="emailCount">0</span></button>
<button class="quick-btn" onclick="tog('addEventForm')">➕ فعالية جديدة</button>
</div>
<div class="add-form" id="addEventForm"><input id="neN" placeholder="اسم الفعالية"><input type="date" id="neD"><input id="neV" placeholder="المكان"><button class="btn-primary" onclick="addEvent()">إضافة</button></div>
<div class="section-title">📅 فعالياتي</div>
<div id="evtList"></div>
</div>

<div class="page" id="emailsPage">
<div class="page-header"><button class="back-btn" onclick="nav('dashboardPage')">→ رجوع</button><div><div class="page-title">📧 الإيميلات</div><div class="email-stats"><span class="badge-green" id="uec">0 متاح</span><span class="badge-red" id="usc">0 مستعمل</span></div></div><button class="btn-primary" onclick="tog('aef')">➕ إضافة</button></div>
<div class="add-form" id="aef"><input type="email" id="neE" placeholder="الإيميل"><input id="neEP" placeholder="كلمة المرور"><button class="btn-primary" onclick="addGEmail()">حفظ</button></div>
<div id="emList"></div>
</div>

<div class="page" id="eventDetailPage">
<div class="page-header"><button class="back-btn" onclick="nav('dashboardPage')">→ رجوع</button><div style="flex:1"></div><button class="btn-outline" onclick="delCurEvt()" style="color:#ef4444;border-color:#ef444466;font-size:13px;padding:8px 14px">🗑 حذف الفعالية</button></div>
<div class="event-hero" id="evtHero"></div>
<button class="btn-dashed" onclick="tog('aetf')" style="margin-bottom:16px">➕ إضافة إيميل وتذاكر</button>
<div class="add-email-form" id="aetf">
<div style="font-size:16px;font-weight:700;color:#fff;margin-bottom:14px">إضافة إيميل وتذاكر</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px" class="add-eg-grid">
<div class="form-field"><span class="form-label">الإيميل *</span><input id="nte" placeholder="example@gmail.com"></div>
<div class="form-field"><span class="form-label">كلمة المرور *</span><input id="ntp" placeholder="كلمة مرور الإيميل"></div>
<div class="form-field"><span class="form-label">عدد التذاكر</span><input type="number" id="ntc" value="1" min="1"></div>
</div>
<div style="margin-top:12px"><button class="btn-primary" onclick="genRows()">📋 تجهيز حقول التذاكر</button></div>
<div id="trf"></div>
<div id="stb" style="display:none;margin-top:14px"><button class="btn-primary" onclick="saveET()">💾 حفظ الكل</button> <button class="btn-outline" onclick="tog('aetf')">إلغاء</button></div>
</div>
<div id="egList" style="margin-top:16px"></div>
</div>

</div>

<script>
const SUPA_URL='https://zrnccyytdiodnwmnkgew.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpybmNjeXl0ZGlvZG53bW5rZ2V3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2NDgwMDEsImV4cCI6MjA4NjIyNDAwMX0.L5cksQi-Tb-k14vwfqvnDNHV6NCgBRff6QjX203hcl0';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let CU=null,CU_ID=null,CU_NAME='',CEI=null;
let eventsCache=[],emailGroupsCache={},ticketsCache={},unusedEmailsCache=[];

function tog(id){document.getElementById(id).classList.toggle('show')}
function daysLeft(d){let e=new Date(d),n=new Date();e.setHours(0,0,0,0);n.setHours(0,0,0,0);return Math.ceil((e-n)/864e5)}
function fmtDate(d){return new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}

// ═══ AUTH ═══
async function doLogin(){
  let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;
  let btn=document.getElementById('loginBtn');
  btn.disabled=true;btn.innerHTML='<span class="loader"></span>';
  let{data,error}=await sb.from('app_users').select('*').eq('username',u).eq('password',p).eq('is_active',true).single();
  btn.disabled=false;btn.textContent='تسجيل الدخول';
  if(error||!data){document.getElementById('loginError').classList.add('show');return}
  CU=u;CU_ID=data.id;CU_NAME=data.name;
  document.getElementById('loginError').classList.remove('show');
  document.getElementById('loginPage').style.display='none';
  nav('dashboardPage');
}
function doLogout(){CU=null;CU_ID=null;document.getElementById('loginPage').style.display='flex';document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'))}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('loginPage').style.display!=='none')doLogin()});

function nav(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('loginPage').style.display='none';
  document.getElementById('loaderPage').style.display='none';
  if(id==='dashboardPage')loadDashboard();
  else if(id==='emailsPage')loadEmails();
  else if(id==='eventDetailPage')loadEventDetail();
  document.getElementById(id).classList.add('active');
}

// ═══ DASHBOARD ═══
async function loadDashboard(){
  document.getElementById('av').textContent=CU_NAME[0];
  document.getElementById('welc').textContent='أهلاً '+CU_NAME+' 👋';

  let{data:events}=await sb.from('events').select('id,name,date,venue').eq('user_id',CU_ID).order('date',{ascending:true});
  eventsCache=events||[];

  let{data:ue}=await sb.from('unused_emails').select('id').eq('user_id',CU_ID);
  document.getElementById('emailCount').textContent=(ue||[]).length;

  let totalSpent=0,totalProfit=0,totalTickets=0;
  for(let ev of eventsCache){
    let{data:egs}=await sb.from('email_groups').select('id').eq('event_id',ev.id);
    ev._egs=egs||[];
    ev._tickets=[];
    for(let eg of ev._egs){
      let{data:tks}=await sb.from('tickets').select('buy_price,profit,sold').eq('email_group_id',eg.id);
      ev._tickets.push(...(tks||[]));
    }
    ev._tickets.forEach(t=>{totalSpent+=Number(t.buy_price)||0;totalProfit+=Number(t.profit)||0;totalTickets++});
  }

  document.getElementById('overviewStats').innerHTML=
    '<div class="stat-card"><div class="stat-card-value">'+totalTickets+'</div><div class="stat-card-label">إجمالي التذاكر</div></div>'+
    '<div class="stat-card"><div class="stat-card-value" style="color:#f59e0b">'+totalSpent.toLocaleString()+'</div><div class="stat-card-label">إجمالي المدفوع (ر.س)</div></div>'+
    '<div class="stat-card"><div class="stat-card-value" style="color:'+(totalProfit>=0?'#22c55e':'#ef4444')+'">'+totalProfit.toLocaleString()+'</div><div class="stat-card-label">إجمالي الأرباح (ر.س)</div></div>';

  let el=document.getElementById('evtList');
  if(!eventsCache.length){el.innerHTML='<div class="empty">لا توجد فعاليات</div>';return}
  el.innerHTML=eventsCache.map(ev=>{
    let d=daysLeft(ev.date),tot=ev._tickets.length,sold=ev._tickets.filter(t=>t.sold).length,pr=ev._tickets.reduce((s,t)=>s+Number(t.profit||0),0);
    let dc=d>7?'#22c55e':d>0?'#f59e0b':'#ef4444',dt=d>0?d:d===0?'اليوم':'انتهت';
    return '<div class="event-card" onclick="openEvt(\''+ev.id+'\')"><div class="event-card-top"><div><div class="event-name">'+ev.name+'</div><div class="event-meta"><span>📍 '+(ev.venue||'')+'</span><span>📅 '+fmtDate(ev.date)+'</span></div></div><button class="btn-sm" onclick="event.stopPropagation();delEvt(\''+ev.id+'\')">🗑</button></div><div class="event-stats"><div class="event-stat"><span class="event-stat-num" style="color:'+dc+'">'+dt+'</span><span class="event-stat-label">'+(d>0?'يوم':'')+'</span></div><div class="event-stat"><span class="event-stat-num">'+tot+'</span><span class="event-stat-label">تذكرة</span></div><div class="event-stat"><span class="event-stat-num">'+sold+'</span><span class="event-stat-label">مباعة</span></div><div class="event-stat"><span class="event-stat-num" style="color:'+(pr>=0?'#22c55e':'#ef4444')+'">'+pr.toLocaleString()+'</span><span class="event-stat-label">ر.س ربح</span></div></div></div>'
  }).join('');
}

async function addEvent(){
  let n=document.getElementById('neN').value.trim(),d=document.getElementById('neD').value,v=document.getElementById('neV').value.trim();

  document.getElementById('neN').value='';document.getElementById('neD').value='';document.getElementById('neV').value='';
  document.getElementById('addEventForm').classList.remove('show');loadDashboard();
}

async function delEvt(id){
  await sb.from('events').delete().eq('id',id);loadDashboard();
}

// ═══ EMAILS ═══
async function loadEmails(){
  let{data:ems}=await sb.from('unused_emails').select('*').eq('user_id',CU_ID).order('created_at',{ascending:false});
  unusedEmailsCache=ems||[];
  let un=unusedEmailsCache.filter(e=>!e.used).length,us=unusedEmailsCache.filter(e=>e.used).length;

  el.innerHTML=unusedEmailsCache.map(em=>'<div class="email-card" style="border-right:4px solid '+(em.used?'#ef4444':'#22c55e')+'"><div class="email-card-header"><div class="email-info"><span class="email-addr">'+em.email+'</span><span class="email-pass">كلمة المرور: '+em.password+'</span><div class="email-status '+(em.used?'used':'available')+'"><span class="status-dot"></span>'+(em.used?' ⛔ مستعمل':' ✅ متاح للاستخدام')+'</div></div><div class="email-actions"><button class="check-btn" style="background:'+(em.used?'#ef4444':'#22c55e')+'" onclick="togUsed(\''+em.id+'\','+(!em.used)+')">'+(em.used?'✕':'✓')+'</button><button class="delete-btn" onclick="delGE(\''+em.id+'\')">🗑</button></div></div></div>').join('');
}

async function addGEmail(){
  let e=document.getElementById('neE').value.trim(),p=document.getElementById('neEP').value.trim();
  if(!e||!p)return;
  await sb.from('unused_emails').insert({user_id:CU_ID,email:e,password:p,used:false});
  document.getElementById('neE').value='';document.getElementById('neEP').value='';
  document.getElementById('aef').classList.remove('show');loadEmails();
}

async function togUsed(id,val){await sb.from('unused_emails').update({used:val}).eq('id',id);loadEmails()}
async function delGE(id){await sb.from('unused_emails').delete().eq('id',id);loadEmails()}

// ═══ EVENT DETAIL ═══
function openEvt(id){CEI=id;nav('eventDetailPage')}

async function loadEventDetail(){
  let{data:ev}=await sb.from('events').select('*').eq('id',CEI).single();
  if(!ev)return;

  let{data:egs}=await sb.from('email_groups').select('*').eq('event_id',CEI).order('created_at');
  egs=egs||[];

  let allTickets={},tot=0,sold=0,pr=0,sp=0;
  for(let eg of egs){
    let{data:tks}=await sb.from('tickets').select('*').eq('email_group_id',eg.id).order('created_at');
    allTickets[eg.id]=tks||[];
    (tks||[]).forEach(t=>{tot++;if(t.sold)sold++;pr+=Number(t.profit)||0;sp+=Number(t.buy_price)||0});
  }

  let d=daysLeft(ev.date),dt=d>0?d:d===0?'اليوم!':'انتهت',dl=d>0?'يوم متبقي':'';
  document.getElementById('evtHero').innerHTML='<div class="event-hero-title">'+ev.name+'</div><div class="event-hero-meta"><span>📅 '+fmtDate(ev.date)+'</span><span>📍 '+ev.venue+'</span></div><div class="countdown-row"><div class="countdown-box"><span class="countdown-num">'+dt+'</span><span class="countdown-label">'+dl+'</span></div><div class="countdown-box"><span class="countdown-num">'+egs.length+'</span><span class="countdown-label">إيميل</span></div><div class="countdown-box"><span class="countdown-num">'+tot+'</span><span class="countdown-label">تذكرة</span></div><div class="countdown-box"><span class="countdown-num">'+sold+'</span><span class="countdown-label">مباعة</span></div><div class="countdown-box"><span class="countdown-num" style="color:#f59e0b">'+sp.toLocaleString()+'</span><span class="countdown-label">مدفوع</span></div><div class="countdown-box"><span class="countdown-num" style="color:'+(pr>=0?'#22c55e':'#ef4444')+'">'+pr.toLocaleString()+'</span><span class="countdown-label">ربح</span></div></div>';

  document.getElementById('trf').innerHTML='';
  document.getElementById('stb').style.display='none';

  let c=document.getElementById('egList');
  if(!egs.length){c.innerHTML='<div class="empty">🎫<br>لا توجد إيميلات / تذاكر بعد</div>';return}

  c.innerHTML=egs.map((eg,ei)=>{
    let tks=allTickets[eg.id]||[];
    let tc=tks.length,sc=tks.filter(t=>t.sold).length;
    let tp=tks.reduce((s,t)=>s+Number(t.profit||0),0);
    let ts=tks.reduce((s,t)=>s+Number(t.buy_price||0),0);

    let rows=tks.map((t,ti)=>{
      let eid='ef_'+ei+'_'+ti;
      return '<tr><td>'+(ti+1)+'</td><td>'+(t.subscription||'—')+'</td><td>'+(t.section||'—')+'</td><td>'+(t.row||'—')+'</td><td>'+(t.seat||'—')+'</td><td>'+Number(t.buy_price||0).toLocaleString()+'</td><td>'+Number(t.sell_price||0).toLocaleString()+'</td><td style="font-weight:700;color:'+(Number(t.profit)>=0?'#22c55e':'#ef4444')+'">'+Number(t.profit||0).toLocaleString()+'</td><td>'+(t.platform||'—')+'</td><td style="font-size:11px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(t.note||'—')+'</td><td><div class="tcheck'+(t.sold?' on s1':'')+'" onclick="tgCh(\''+t.id+'\',\'sold\','+(!t.sold)+')">✓</div></td><td><div class="tcheck'+(t.sent?' on s2':'')+'" onclick="tgCh(\''+t.id+'\',\'sent\','+(!t.sent)+')">✓</div></td><td><div class="tcheck'+(t.paid?' on s3':'')+'" onclick="tgCh(\''+t.id+'\',\'paid\','+(!t.paid)+')">✓</div></td><td style="display:flex;gap:4px"><button class="btn-sm" onclick="togEdit(\''+eid+'\')" style="color:#818cf8;border-color:#818cf866">✏️</button><button class="btn-sm" onclick="delTk(\''+t.id+'\',\''+eg.id+'\')">🗑</button></td></tr>'
      +'<tr id="'+eid+'" style="display:none"><td colspan="14" style="padding:0"><div class="edit-form"><div style="font-size:13px;font-weight:700;color:#818cf8;margin-bottom:10px">✏️ تعديل التذكرة '+(ti+1)+'</div><div class="form-grid">'
      +'<div class="form-field"><span class="form-label">الاشتراك</span><input id="ed_sub_'+t.id+'" value="'+(t.subscription||'')+'"></div>'
      +'<div class="form-field"><span class="form-label">القسم</span><input id="ed_sec_'+t.id+'" value="'+(t.section||'')+'"></div>'
      +'<div class="form-field"><span class="form-label">الصف</span><input id="ed_row_'+t.id+'" value="'+(t.row||'')+'"></div>'
      +'<div class="form-field"><span class="form-label">المقعد</span><input id="ed_seat_'+t.id+'" value="'+(t.seat||'')+'"></div>'
      +'<div class="form-field"><span class="form-label">سعر الشراء</span><input type="number" id="ed_buy_'+t.id+'" value="'+Number(t.buy_price||0)+'"></div>'
      +'<div class="form-field"><span class="form-label">سعر البيع</span><input type="number" id="ed_sell_'+t.id+'" value="'+Number(t.sell_price||0)+'"></div>'
      +'<div class="form-field"><span class="form-label">المنصة</span><input id="ed_plat_'+t.id+'" value="'+(t.platform||'')+'"></div>'
      +'<div class="form-field"><span class="form-label">ملاحظة</span><input id="ed_note_'+t.id+'" value="'+(t.note||'')+'"></div>'
      +'</div><div class="edit-actions"><button class="btn-primary" onclick="saveEdit(\''+t.id+'\')" style="font-size:12px;padding:8px 16px">💾 حفظ</button><button class="btn-outline" onclick="togEdit(\''+eid+'\')" style="font-size:12px;padding:8px 16px">إلغاء</button></div></div></td></tr>';
    }).join('');

    return '<div class="email-group" id="eg'+ei+'"><div class="email-group-header" onclick="document.getElementById(\'eg'+ei+'\').classList.toggle(\'open\')"><div class="eg-right"><div class="eg-icon">📧</div><div class="eg-info"><span class="eg-name">'+eg.email+'</span><span class="eg-sub" style="font-family:monospace;direction:ltr;text-align:right">🔑 '+(eg.password||'—')+'</span><span class="eg-sub">'+tc+' تذكرة · '+sc+' مباعة</span></div></div><div class="eg-stats"><div class="mini-stat"><span class="mini-stat-num" style="color:#f59e0b">'+ts.toLocaleString()+'</span><span class="mini-stat-label">مدفوع</span></div><div class="mini-stat"><span class="mini-stat-num" style="color:'+(tp>=0?'#22c55e':'#ef4444')+'">'+tp.toLocaleString()+'</span><span class="mini-stat-label">ربح</span></div><span class="eg-arrow">◀</span></div></div><div class="email-group-body"><div class="table-wrap"><table class="ticket-table"><thead><tr><th>#</th><th>الاشتراك</th><th>القسم</th><th>الصف</th><th>المقعد</th><th>الشراء</th><th>البيع</th><th>الربح</th><th>المنصة</th><th>ملاحظة</th><th>بيع</th><th>إرسال</th><th>دفع</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><div style="padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-outline" onclick="addTkToG(\''+eg.id+'\')" style="font-size:12px;padding:8px 14px">➕ إضافة تذكرة</button><button class="btn-outline" onclick="delEG(\''+eg.id+'\')" style="font-size:12px;padding:8px 14px;color:#ef4444;border-color:#ef444466">🗑 حذف الإيميل</button></div></div></div>'
  }).join('');
}

async function delCurEvt(){await sb.from('events').delete().eq('id',CEI);nav('dashboardPage')}

function genRows(){
  let n=parseInt(document.getElementById('ntc').value)||1,h='';
  for(let i=0;i<n;i++){
    h+='<div class="ticket-row-card"><div class="ticket-row-title">تذكرة '+(i+1)+'</div><div class="form-grid"><div class="form-field"><span class="form-label">الاشتراك</span><input id="rs'+i+'" placeholder="VIP / Regular"></div><div class="form-field"><span class="form-label">القسم</span><input id="rc'+i+'" placeholder="A, B..."></div><div class="form-field"><span class="form-label">الصف</span><input id="rr'+i+'" placeholder="الصف"></div><div class="form-field"><span class="form-label">المقعد</span><input id="rt'+i+'" placeholder="المقعد"></div><div class="form-field"><span class="form-label">سعر الشراء</span><input type="number" id="rb'+i+'" placeholder="0"></div><div class="form-field"><span class="form-label">سعر البيع</span><input type="number" id="rl'+i+'" placeholder="0"></div><div class="form-field"><span class="form-label">المنصة</span><input id="rp'+i+'" placeholder="حراج..."></div><div class="form-field"><span class="form-label">ملاحظة</span><input id="rn'+i+'" placeholder="ملاحظات..."></div></div></div>';
  }
  document.getElementById('trf').innerHTML=h;
  document.getElementById('stb').style.display='flex';
}

async function saveET(){
  let email=document.getElementById('nte').value.trim();
  let epass=document.getElementById('ntp').value.trim();
  if(!email){document.getElementById('nte').style.borderColor='#ef4444';return}
  document.getElementById('nte').style.borderColor='#2a2a4a';
  if(!epass){document.getElementById('ntp').style.borderColor='#ef4444';return}
  document.getElementById('ntp').style.borderColor='#2a2a4a';

  let{data:eg}=await sb.from('email_groups').select('id').eq('event_id',CEI).eq('email',email).single();
  let egId;
  if(eg){egId=eg.id;await sb.from('email_groups').update({password:epass}).eq('id',egId)}
  else{let{data:newEg}=await sb.from('email_groups').insert({event_id:CEI,email,password:epass}).select('id').single();egId=newEg.id}

  let n=parseInt(document.getElementById('ntc').value)||1;
  let tks=[];
  for(let i=0;i<n;i++){
    let b=parseFloat(document.getElementById('rb'+i)?.value)||0;
    let s=parseFloat(document.getElementById('rl'+i)?.value)||0;
    tks.push({email_group_id:egId,subscription:document.getElementById('rs'+i)?.value||'',section:document.getElementById('rc'+i)?.value||'',row:document.getElementById('rr'+i)?.value||'',seat:document.getElementById('rt'+i)?.value||'',buy_price:b,sell_price:s,profit:s-b,platform:document.getElementById('rp'+i)?.value||'',note:document.getElementById('rn'+i)?.value||''});
  }
  await sb.from('tickets').insert(tks);

  document.getElementById('nte').value='';document.getElementById('ntp').value='';document.getElementById('ntc').value='1';
  document.getElementById('trf').innerHTML='';document.getElementById('stb').style.display='none';
  document.getElementById('aetf').classList.remove('show');loadEventDetail();
}

async function addTkToG(egId){
  await sb.from('tickets').insert({email_group_id:egId});loadEventDetail();
}

async function tgCh(tkId,field,val){
  let upd={};upd[field]=val;
  await sb.from('tickets').update(upd).eq('id',tkId);loadEventDetail();
}

async function delTk(tkId,egId){
  await sb.from('tickets').delete().eq('id',tkId);
  let{data:remaining}=await sb.from('tickets').select('id').eq('email_group_id',egId);
  if(!remaining||!remaining.length)await sb.from('email_groups').delete().eq('id',egId);
  loadEventDetail();
}

function togEdit(id){let r=document.getElementById(id);r.style.display=r.style.display==='none'?'table-row':'none'}

async function saveEdit(tkId){
  let b=parseFloat(document.getElementById('ed_buy_'+tkId).value)||0;
  let s=parseFloat(document.getElementById('ed_sell_'+tkId).value)||0;
  await sb.from('tickets').update({
    subscription:document.getElementById('ed_sub_'+tkId).value,
    section:document.getElementById('ed_sec_'+tkId).value,
    row:document.getElementById('ed_row_'+tkId).value,
    seat:document.getElementById('ed_seat_'+tkId).value,
    buy_price:b,sell_price:s,profit:s-b,
    platform:document.getElementById('ed_plat_'+tkId).value,
    note:document.getElementById('ed_note_'+tkId).value
  }).eq('id',tkId);
  loadEventDetail();
}

async function delEG(egId){await sb.from('email_groups').delete().eq('id',egId);loadEventDetail()}

// ═══ INIT ═══
document.getElementById('loaderPage').style.display='none';
document.getElementById('loginPage').style.display='flex';
</script>
